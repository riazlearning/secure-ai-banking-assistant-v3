[project]
name = "secure-ai-banking-assistant-v3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "riaz", email = "riazlearning@gmail.com" }
]
requires-python = ">=3.13.5"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.10",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.1.3",
    "mcp>=1.26,<2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2,<3",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "python-json-logger>=4.2.0",
    "streamlit>=1.65.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
banking-mcp-server = "banking_assistant.mcp.server:main"
secure-ai-banking-assistant-v3 = "secure_ai_banking_assistant_v3:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "banking_assistant"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]
